<!doctype html>
<html lang="ne">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>पशुपति मन्दिर — फोटो पठाउनुहोस्</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f5f3ee;color:#242424}
main{max-width:560px;margin:32px auto;padding:24px;background:white;border-radius:18px;box-shadow:0 8px 30px #0001}
h1{text-align:center;color:#8a3b16;font-size:1.6rem}p{text-align:center;line-height:1.6}
label{display:block;margin:16px 0 7px;font-weight:600}input,textarea,button{width:100%;font:inherit}
input,textarea{padding:12px;border:1px solid #ccc;border-radius:10px;background:#fff}
button{margin-top:18px;padding:14px;border:0;border-radius:10px;background:#9b4219;color:white;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}.hint{font-size:.88rem;color:#666}.status{margin-top:14px;padding:12px;border-radius:10px;display:none;white-space:pre-wrap}
.ok{background:#e7f6e9;color:#155724}.err{background:#fdeaea;color:#842029}
</style>
</head>
<body>
<main>
<h1>पशुपति मन्दिर धादिङ</h1>
<p><strong>मन्दिरका सम्झनाहरू हामीसँग बाँड्नुहोस्</strong><br>मोबाइलको Gallery बाट फोटो छानेर पठाउनुहोस्।</p>
<form id="form">
<label for="name">तपाईंको नाम (ऐच्छिक)</label>
<input id="name" maxlength="80" placeholder="नाम लेख्नुहोस्">
<label for="note">फोटोको विवरण (ऐच्छिक)</label>
<textarea id="note" rows="3" maxlength="500" placeholder="फोटो कहिले वा कहाँ खिचिएको हो?"></textarea>
<label for="photos">फोटो छान्नुहोस्</label>
<input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple required>
<div class="hint">JPG, PNG वा WebP फोटो मात्र। एक पटकमा बढीमा 5 फोटो, प्रत्येक 8 MB सम्म।</div>
<button id="send" type="submit">फोटो पठाउनुहोस्</button>
</form>
<div id="status" class="status" role="status"></div>
<p class="hint">फोटो पठाउँदा तपाईंले मन्दिरको फोटो अभिलेखमा सुरक्षित गर्न सहमति दिनुभएको मानिनेछ।</p>
</main>
<script>
const ENDPOINT = "https://script.google.com/macros/s/AKfycbw8FCDtvchNNzwDkMMeozQbEBT9Oxsuz2T6ISoX15DB_cPsAL-bwVAoTB7abVr90XLA/exec";
const form=document.getElementById('form'), statusBox=document.getElementById('status'), send=document.getElementById('send');
form.addEventListener('submit', async e=>{
 e.preventDefault(); statusBox.style.display='block'; statusBox.className='status';
 const files=[...document.getElementById('photos').files];
 if(!files.length){statusBox.textContent='कृपया फोटो छान्नुहोस्।';statusBox.classList.add('err');return;}
 if(files.length>5){statusBox.textContent='एक पटकमा बढीमा 5 फोटो मात्र पठाउन मिल्छ।';statusBox.classList.add('err');return;}
 if(files.some(f=>f.size>8*1024*1024)){statusBox.textContent='हरेक फोटो 8 MB भन्दा सानो हुनुपर्छ।';statusBox.classList.add('err');return;}
 if(ENDPOINT.includes('PASTE_YOUR')){statusBox.textContent='अहिले अपलोड सेवा सेटअप भएको छैन। कृपया व्यवस्थापकलाई सम्पर्क गर्नुहोस्।';statusBox.classList.add('err');return;}
 send.disabled=true; send.textContent='पठाउँदै...';
 try{
  for(let i=0;i<files.length;i++){
   const f=files[i], data=await new Promise((resolve,reject)=>{
    const r=new FileReader();r.onload=()=>resolve(r.result.split(',')[1]);r.onerror=reject;r.readAsDataURL(f);
   });
   const payload={name:document.getElementById('name').value,note:document.getElementById('note').value,
    filename:f.name,mimeType:f.type,data};
   await fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
   statusBox.textContent=`${i+1}/${files.length} फोटो पठाइयो...`;
  }
  statusBox.classList.add('ok');statusBox.textContent='फोटो पठाउने अनुरोध पूरा भयो। Drive मा सुरक्षित हुन केही क्षण लाग्न सक्छ। धन्यवाद!';
  form.reset();
 }catch(err){statusBox.classList.add('err');statusBox.textContent='फोटो पठाउन सकिएन। इन्टरनेट जाँचेर फेरि प्रयास गर्नुहोस्।';}
 finally{send.disabled=false;send.textContent='फोटो पठाउनुहोस्';}
});
</script>
</body></html>
